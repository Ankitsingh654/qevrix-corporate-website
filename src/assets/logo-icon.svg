<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Deep blue radial gradient for the main body to simulate 3D -->
    <radialGradient id="qBodyGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="60%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    
    <!-- Bright blue linear gradient for the tail -->
    <linearGradient id="qTailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>

    <!-- Glowing cyan for the circuit nodes -->
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="1"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Circle for Q -->
  <path d="M250,50 C139.54,50 50,139.54 50,250 C50,360.46 139.54,450 250,450 C293.42,450 333.6,436.14 366.5,412.5 L300,320 C285.5,328.2 268.3,333 250,333 C204.16,333 167,295.84 167,250 C167,204.16 204.16,167 250,167 C295.84,167 333,204.16 333,250 C333,277.5 319.6,301.8 298.5,316.5 L365,409 C404.7,370.8 430,313.4 430,250 C430,139.54 340.46,50 250,50 Z" fill="url(#qBodyGrad)" />
  
  <!-- The Q Tail -->
  <path d="M235,260 L400,450 L470,450 L305,260 Z" fill="url(#qTailGrad)" />
  
  <!-- Inner Ring Highlight (Subtle 3D edge) -->
  <path d="M250,65 C147.8,65 65,147.8 65,250 C65,352.2 147.8,435 250,435 C286.2,435 320.1,424.6 349,406.8 L308.2,348.6 C290.4,357.6 270.8,363 250,363 C187.6,363 137,312.4 137,250 C137,187.6 187.6,137 250,137 C312.4,137 363,187.6 363,250 C363,270.1 357.6,289 348.3,306 L389,363.5 C405.5,331.4 415,292 415,250 C415,158.9 341.1,85 250,85" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.4" />

  <!-- Circuit Lines & Nodes (Left Side) -->
  <g stroke="#06b6d4" stroke-width="4" fill="none" opacity="0.9">
    <!-- Top wire -->
    <path d="M125,185 C100,210 90,240 100,270" />
    <circle cx="125" cy="185" r="8" fill="#06b6d4" filter="url(#glow)" />
    <!-- Mid wire -->
    <path d="M110,210 C85,240 85,280 115,310" />
    <circle cx="110" cy="210" r="7" fill="#06b6d4" filter="url(#glow)" />
    <!-- Bottom wire -->
    <path d="M100,235 L95,250 C80,290 100,340 135,360" />
    <circle cx="100" cy="235" r="6" fill="#06b6d4" filter="url(#glow)" />
  </g>
</svg>
